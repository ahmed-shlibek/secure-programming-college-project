# Listening port (${PORT}) is configured in ports.conf, resolved from
# the environment by the entrypoint script.
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Front controller: route every request that isn't a real file
        # (e.g. /login, /dashboard) to public/index.php. Real assets
        # under public/ (css, js) are still served directly.
        FallbackResource /index.php
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>